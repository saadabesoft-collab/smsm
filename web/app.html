<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7fe0">
<title>سمسم</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* VOICE: صاحب لطيف وخفيف دم بيفتكرلك كل حاجة — هادي ومريح
   IDEA: عفريت الفانوس سمسم: سماء ليل بنفسجي فيها نجوم، والساعة الكبيرة هي قلب الشاشة
   PICTURE: الساعة وتاريخ النهارده فوق سماء بنفسجي، وسمسم بيطل من الفانوس جنب زرار الميكروفون
   COLOUR and TYPE: بنفسجي نيلي هادي + تركواز + خوخي للتأجيل + دهبي للفانوس. Reem Kufi للعناوين وPlex Arabic للواجهة
   LAYOUT: عمود واحد للموبايل، شريط تنقل تحت، والتذكير بيطلع Pop-up في نص الشاشة */
@font-face{font-family:"Reem Kufi";src:url(fonts/ReemKufi.ttf) format("truetype");font-weight:400 700;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(fonts/Plex-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(fonts/Plex-SemiBold.ttf) format("truetype");font-weight:500 700;font-display:swap}
:root{color-scheme:light;--night:#2f7fe0;--night2:#62b3f6;--stars:0;--sun:.6;--pri:#2f7fe0;--pri2:#5aa7f2;--teal:#e0a91b;--peach:#f5c451;--gold:#e0a91b;--gold2:#f7d46c;
--bg:#f3f8ff;--card:#ffffff;--ink:#13284a;--muted:#5d7290;--line:#dce7f6;--soft:#e9f2fd;--ok:#2f7fe0;--warn:#d9534f}
:root[data-theme=dark]{color-scheme:dark;--night:#0b1a36;--night2:#1d3c72;--stars:.8;--sun:.35;--pri:#4c97f0;--pri2:#7ab6f7;--ok:#4c97f0;
--bg:#0a1427;--card:#12213d;--ink:#eaf1ff;--muted:#9fb3d3;--line:#22375c;--soft:#1a2c4e}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;line-height:1.2;margin:0}
h2{font-size:20px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.sky{background:linear-gradient(160deg,var(--night),var(--night2));color:#fff;position:relative;overflow:hidden;padding:calc(14px + env(safe-area-inset-top)) 0 46px}
.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(1.4px 1.4px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 34% 70%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 78% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 60%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 58% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 88%,#fff 50%,transparent 51%);opacity:var(--stars);transition:opacity .4s}
.sky::after{content:"";position:absolute;width:260px;height:260px;top:-110px;inset-inline-end:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,102,.75),rgba(255,214,102,0) 70%);opacity:var(--sun);pointer-events:none}
.sky .wrap{position:relative}
.topb{display:flex;align-items:center;gap:10px}
.topb svg{width:44px;height:44px;border-radius:12px;flex:none}
.topb b{font-family:"Reem Kufi";font-size:22px;display:block;line-height:1.1}.topb span{font-size:13px;opacity:.85}
.tgl{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}.tgl svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topb .btn{background:rgba(255,255,255,.18)!important}
.clock{text-align:center;margin-top:14px}
.clock .t{font-size:clamp(56px,17vw,84px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .t small{font-size:.3em;opacity:.8;margin-inline-start:6px}
.clock .d{font-family:"Reem Kufi";font-size:19px;margin-top:6px}.clock .h{font-size:14px;opacity:.8}
.mics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-30px;position:relative;z-index:2}
.mic{background:var(--card);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 10px 26px rgba(19,40,74,.18);font-weight:600;min-height:118px}
.mic .ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--pri),var(--pri2));box-shadow:0 6px 16px rgba(47,127,224,.4)}
.mic.note .ring{background:linear-gradient(140deg,var(--gold),var(--gold2));box-shadow:0 6px 16px rgba(224,169,27,.4)}
.mic .ring svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.live .ring{animation:pulse 1.1s infinite}
.mic small{font-weight:400;color:var(--muted);font-size:12px;text-align:center}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,127,224,.55)}100%{box-shadow:0 0 0 22px rgba(47,127,224,0)}}
.say{display:flex;gap:8px;margin-top:12px}
.say input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:48px;font-size:16px}
.btn{background:var(--pri);color:#fff;border-radius:14px;padding:10px 16px;min-height:46px;font-weight:600}
.btn.teal{background:var(--teal)}.btn.peach{background:var(--peach);color:#3b1a0c}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}.btn.ok{background:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips button{flex:none;background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.ch{display:flex;align-items:center;gap:10px;justify-content:space-between}
.muted{color:var(--muted);font-size:14px}
.prog{display:flex;align-items:center;gap:14px}
.pr{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none;position:relative}
.pr::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.pr b{position:relative;font-size:15px}
.task{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.tm{flex:none;min-width:66px;text-align:center;background:var(--soft);border-radius:12px;padding:6px 4px;font-weight:600;font-size:14px;line-height:1.2}
.tm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.task.late .tm{background:color-mix(in srgb,var(--peach) 30%,transparent)}
.task .tx{flex:1;line-height:1.4}.task .tx small{display:block;color:var(--muted);font-size:12px}
.task.done .tx b{text-decoration:line-through;opacity:.6}.task.done .tm{opacity:.5}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.task.done .ck{background:var(--ok);border-color:var(--ok)}
.task.done .ck::after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;padding:16px 6px;color:var(--muted)}
.empty svg{width:90px;height:90px;border-radius:22px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav button{padding:8px 0 6px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);font-weight:600}
.view{display:none}.view.on{display:block}
.vh{background:linear-gradient(160deg,var(--night),var(--night2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 0 18px}
.vh h1{font-size:26px}.vh p{margin:2px 0 0;opacity:.85;font-size:14px}
.yr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.mm b{font-family:"Reem Kufi";font-size:14px}
.mm .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:9px;color:var(--muted);margin-top:4px}
.mm .g i{font-style:normal;border-radius:4px;padding:1px 0}.mm .g i.has{background:var(--pri);color:#fff}.mm .g i.td{outline:1.5px solid var(--teal)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .hd{font-size:12px;color:var(--muted);font-weight:600}
.cal button{min-height:48px;border-radius:12px;background:var(--soft);font-size:15px;position:relative}
.cal button.td{outline:2px solid var(--teal)}.cal button.sel{background:var(--pri);color:#fff}
.cal button .dot{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--peach)}
.form{display:grid;gap:10px;margin-top:12px}
.form input,.form select{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:46px;font-size:16px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set:first-of-type{border-top:0}.set label{flex:1 1 180px}.set small{display:block;color:var(--muted);font-size:13px}
.set input[type=number],.set input[type=time],.set input[type=text],.set select{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;font-size:16px}
.set input[type=number]{width:90px}
.sw{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--teal)}.sw:checked::after{inset-inline-start:25px}
.snz{display:flex;gap:6px;flex-wrap:wrap}
.snz button{background:var(--soft);border-radius:99px;padding:7px 14px;font-size:14px;border:2px solid transparent}
.snz button.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pri));border-radius:99px}
.rep{padding:12px 0;border-top:1px solid var(--line)}.rep:first-of-type{border-top:0}
textarea{width:100%;min-height:110px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;direction:ltr}
/* pop-up */
#pop{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:rgba(12,10,40,.62);backdrop-filter:blur(4px)}
#pop.on{display:flex}
.pc{background:var(--card);border-radius:26px;max-width:440px;width:100%;max-height:100%;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:popin .3s ease;text-align:center}
.ph{background:linear-gradient(160deg,var(--night),var(--night2));color:#fff;padding:18px 18px 12px;border-radius:26px 26px 0 0}
.ph svg{width:84px;height:84px;border-radius:22px;animation:bob 2.4s ease-in-out infinite}
.ph p{margin:6px 0 0;opacity:.85;font-size:14px}
.pb{padding:16px 18px 18px}
.pb h2{font-size:24px;line-height:1.35}
.pb .tl{color:var(--muted);font-size:14px;margin-top:4px}
.pact{display:grid;gap:10px;margin-top:16px}
.pact .ok{min-height:56px;font-size:18px}
.pact .snz{justify-content:center}
.pact .snz button{background:color-mix(in srgb,var(--peach) 22%,var(--card));font-weight:600}
audio{width:100%;margin-top:10px}
@keyframes popin{from{transform:translateY(14px) scale(.98);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}
#sheet{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(12,10,40,.45)}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:popin .25s}
.rec{display:flex;align-items:center;gap:12px;justify-content:center;font-size:28px;font-variant-numeric:tabular-nums;margin:10px 0}
.rec i{width:14px;height:14px;border-radius:50%;background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));inset-inline:16px;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:95;text-align:center;animation:popin .3s}
.heard{background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:15px}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#123a73,#2f6fc4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;transition:opacity .5s}
#splash svg{width:150px;height:150px;border-radius:34px;animation:popin .6s}
#splash b{font-family:"Reem Kufi";font-size:40px;margin-top:6px}#splash span{letter-spacing:.3em;opacity:.8}
#splash .bs{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));font-size:13px;opacity:.7;letter-spacing:.08em}
#splash.out{opacity:0;pointer-events:none}
.brand{text-align:center;color:var(--muted);font-size:13px;padding:22px 0 8px}.brand b{font-family:"Reem Kufi";color:var(--pri)}

/* chat with سمسم */
#v-chat{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#v-chat.on{display:flex}
.chh{background:linear-gradient(160deg,var(--night),var(--night2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;display:flex;align-items:center;gap:10px}
.chh svg.g{width:42px;height:42px;border-radius:12px;flex:none}.chh b{font-family:"Reem Kufi";font-size:20px;display:block;line-height:1.1}.chh span{font-size:12px;opacity:.85}
.chh .x{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;font-size:20px}
#chatLog{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;line-height:1.55;font-size:16px;white-space:pre-wrap}
.bub.me{align-self:flex-start;background:var(--pri);color:#fff;border-end-start-radius:6px}
.bub.ai{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-end-end-radius:6px}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:13px;padding:2px 8px}
.bub.act{align-self:flex-end;background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);font-size:14px}
.chb{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.chb input{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:10px 16px;min-height:48px;font-size:16px}
.chb .mic2{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,var(--pri),var(--pri2));display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(47,127,224,.4)}
.chb .mic2 svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.chb .mic2.live{animation:pulse 1.1s infinite;background:linear-gradient(140deg,var(--gold),var(--gold2))}
.chb .snd{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;font-size:20px}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
