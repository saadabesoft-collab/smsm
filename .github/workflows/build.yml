name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk smsm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smsm-apk
          path: smsm.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: سمسم — إصدار ${{ github.run_number }}
          body: حمّل ملف smsm.apk على موبايل أندرويد وسطّبه. ولو عندك نسخة قديمة هيتحدّث فوقها.
          files: smsm.apk
  web:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
